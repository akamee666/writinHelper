[package]
name = "writin-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = "0.28.1"
axum = { version = "0.8.3", features = ["ws"] }
futures-util = "0.3.31"
hyper = { version = "1.6.0", features = ["server"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "cors"] }

