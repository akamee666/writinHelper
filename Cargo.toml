[package]
name = "writin-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.3", features = ["ws"] }
clap = { version = "4.5.37", features = ["derive"] }
ollama-rs = { version = "0.3.1", features = ["stream"] }
reqwest = { version = "0.12.15", features = ["cookies", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.17"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "cors"] }
tracing = "0.1.40" # Updated version
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] } # Updated version and added fmt feature

